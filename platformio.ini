; WH Board Tester — M5Stack CoreS3 SE
; See SPEC.md for requirements.

[platformio]
default_envs = m5stack-cores3
; The project lives on Google Drive. Keep the (large, frequently changing)
; build and library cache on the local disk so Drive does not try to sync it.
workspace_dir = ${sysenv.LOCALAPPDATA}/pio-workspaces/wh-tester

[env]
; Pure logic (state machine, FIRED detection) lives in lib/wh_logic so it is
; shared by the firmware and the native unit tests.
test_framework = unity

[env:m5stack-cores3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -Iinclude
lib_deps =
    m5stack/M5Unified@^0.2.21
    m5stack/M5GFX@^0.2.28
    lvgl/lvgl@~9.2.2

; Host unit tests (needs a host gcc/g++, e.g. MSYS2 on Windows).
; The same tests also run on the CoreS3: pio test -e m5stack-cores3
[env:native]
platform = native
build_flags =
    -std=gnu++17
    -Iinclude
